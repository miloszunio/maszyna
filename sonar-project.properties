# the fork of miloszunio, its branch ficzery2 analysed as the main one (the free plan analyses only that)
sonar.organization=miloszunio
sonar.projectKey=miloszunio_maszyna
sonar.projectName=maszyna

sonar.sources=.
sonar.sourceEncoding=UTF-8

# Exclusions
# .trusted/ is the copy of master the analysis workflow checks out to restore its
# own configuration; analysing it would duplicate every file of the base branch.
sonar.exclusions=ref/**,imgui/**,stb/**,build/**,bw-output/**,.trusted/**

# Excluding all files from coverage making the gate skip that
# instead of failing it.
sonar.coverage.exclusions=**/*
