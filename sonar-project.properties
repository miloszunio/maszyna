# the fork of miloszunio, its branch ficzery2 analysed as the main one (the free plan analyses only that)
sonar.organization=miloszunio
sonar.projectKey=miloszunio_maszyna
sonar.projectName=maszyna

sonar.sources=.
sonar.sourceEncoding=UTF-8

# Exclusions
# .trusted/ is the copy of master the analysis workflow checks out to restore its
# own configuration; analysing it would duplicate every file of the base branch.
sonar.exclusions=ref/**,imgui/**,stb/**,build/**,bw-output/**,.trusted/**

# Excluding all files from coverage making the gate skip that
# instead of failing it.
sonar.coverage.exclusions=**/*

# Issues left out on purpose (the analysis reads this file from the default branch, ficzery2):
# - tools/** and shaders/*.py are scripts a developer runs by hand on files of their own choice: the paths
#   and the command they take from the command line are the point of them, not a hole (pythonsecurity:S8701,
#   S8705, S8707 - path traversal and command injection);
# - imgw_normals.py writes the MPL header with its http:// address, word for word as every source file has it
#   (python:S5332);
# - the film mode lays trees out with std::mt19937 of a fixed seed, so that the same film gives the same trees
#   each time: nothing secret depends on it (cpp:S2245).
sonar.issue.ignore.multicriteria=tools,shaders,mpl,film
sonar.issue.ignore.multicriteria.tools.ruleKey=pythonsecurity:*
sonar.issue.ignore.multicriteria.tools.resourceKey=tools/**/*.py
sonar.issue.ignore.multicriteria.shaders.ruleKey=pythonsecurity:*
sonar.issue.ignore.multicriteria.shaders.resourceKey=shaders/*.py
sonar.issue.ignore.multicriteria.mpl.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.mpl.resourceKey=tools/weather/imgw_normals.py
sonar.issue.ignore.multicriteria.film.ruleKey=cpp:S2245
sonar.issue.ignore.multicriteria.film.resourceKey=application/editormodefilm.cpp
